<nav class="navbar bg-dark" *ngIf="isHeaderVisible">
  <div class="container-fluid">
    <form class="d-flex" role="search" (submit)="search($event)">
      <input
        class="form-control me-2"
        type="search"
        placeholder="Search"
        aria-label="Search"
        [formControl]="searchControl"
      />
      <button class="btn btn-outline-primary" #value type="search">
        Search
      </button>
    </form>
    <div class="liveClock">
      <p *ngIf="clockLoading">Loading Local Clock...</p>
      <p>
        {{ displayClock }}
      </p>
    </div>
    <div class="github">
      <a
        href="https://github.com/Luka288"
        target="_blank"
        class="d-flex correct"
      >
        <span>
          <i class="fa-brands fa-github" style="color: #ffffff"></i>
        </span>
        Luka288
      </a>
    </div>
  </div>
</nav>
