<div class="foreCasts">
  <button class="hourlyCast" (click)="toggleContainer()">
    <i class="fas fa-clock"></i> {{ "hourly_forecast" | transloco }}
  </button>
  <div class="container">
    <div class="title">
      <p class="titleText">{{ "15_day_forecast" | transloco }}</p>
    </div>
    <div class="cards">
      @for (item of weatherData()?.days; track $index) {
        <app-forecast-card [forecastCard]="item" [location]="weatherData()!" />
      }
    </div>
  </div>
</div>
