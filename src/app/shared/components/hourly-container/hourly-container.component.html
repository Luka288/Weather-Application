<div class="hourly" [ngClass]="{ active: isOpen(), }">
  <div
    class="hourlyWeather"
    *ngFor="let foreCast of foreCast"
    [ngClass]="{ currentHour: isCurrentHour(foreCast.datetimeEpoch) }"
    scrollToView
  >
    <span *ngIf="isCurrentHour(foreCast.datetimeEpoch)">
      <i class="fa-solid fa-clock"></i>
      Current time
    </span>
    <p class="date">
      {{ foreCast.datetimeEpoch | dateFormat }}
    </p>
    <p class="timeP">{{ foreCast.datetime | formatTime }}</p>
    <p class="temp">{{ foreCast.temp | roundTemp }} °C</p>
    <p class="cond">{{ foreCast.conditions }}</p>
  </div>
</div>
