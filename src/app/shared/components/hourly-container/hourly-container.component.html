<div class="hourly" [ngClass]="{ active: isOpen() }">
  <div class="hourlyWeather" *ngFor="let foreCast of foreCast">
    <p class="date">{{ foreCast.datetimeEpoch | dateFormat }}</p>
    <p class="timeP">{{ foreCast.datetime | formatTime }}</p>
    <p class="temp">{{ foreCast.temp | roundTemp }} °C</p>
    <p class="cond">{{ foreCast.conditions }}</p>
  </div>
</div>
